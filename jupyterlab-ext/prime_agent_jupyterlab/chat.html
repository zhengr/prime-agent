<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prime Agent Chat</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
.header { padding: 12px 16px; background: #16213e; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
.header h1 { font-size: 16px; font-weight: 600; }
.status { font-size: 11px; padding: 3px 10px; border-radius: 12px; background: #555; }
.status.connected { background: #28a745; color: #fff; }
.status.error { background: #dc3545; color: #fff; }
.output { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.msg { padding: 10px 14px; border-radius: 8px; max-width: 90%; line-height: 1.5; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
.msg.user { background: #0f3460; align-self: flex-end; color: #fff; }
.msg.agent { background: #1a1a2e; border: 1px solid #333; align-self: flex-start; }
.msg.error { background: #3d0000; border: 1px solid #dc3545; color: #ff6b6b; }
.msg.system { background: transparent; color: #888; font-size: 12px; text-align: center; align-self: center; padding: 4px 12px; }
.msg code { background: rgba(255,255,255,0.1); padding: 1px 4px; border-radius: 3px; font-size: 12px; }
.msg pre { background: rgba(0,0,0,0.3); padding: 8px; border-radius: 4px; overflow-x: auto; margin: 4px 0; }
.input-area { padding: 12px 16px; background: #16213e; border-top: 1px solid #333; }
textarea { width: 100%; min-height: 56px; padding: 10px; border: 1px solid #444; border-radius: 6px; background: #1a1a2e; color: #e0e0e0; font-family: inherit; font-size: 13px; resize: vertical; outline: none; }
textarea:focus { border-color: #0f3460; }
textarea:disabled { opacity: 0.5; }
.btn-row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
button { padding: 6px 18px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 500; }
.btn-send { background: #0f3460; color: #fff; }
.btn-send:hover { background: #1a4a8a; }
.btn-stop { background: #dc3545; color: #fff; display: none; }
.btn-stop:hover { background: #c82333; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
</style>
</head>
<body>

<div class="header">
  <h1>🤖 Prime Agent</h1>
  <span class="status" id="status">Connecting...</span>
</div>

<div class="output" id="output"></div>

<div class="input-area">
  <textarea id="input" placeholder="Ask Prime Agent anything... (Shift+Enter for newline)" rows="3"></textarea>
  <div class="btn-row">
    <button class="btn-stop" id="btnStop" onclick="stopAgent()">Stop</button>
    <button class="btn-send" id="btnSend" onclick="send()">Send</button>
  </div>
</div>

<script>
const output = document.getElementById('output');
const input = document.getElementById('input');
const statusEl = document.getElementById('status');
const btnSend = document.getElementById('btnSend');
const btnStop = document.getElementById('btnStop');
let ws = null;
let currentEl = null;
let currentText = '';

function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/api/prime-agent/chat/default`);

  ws.onopen = () => {
    statusEl.textContent = 'Connected';
    statusEl.className = 'status connected';
    addMsg('system', 'Connected to Prime Agent');
  };

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'event') handleEvent(msg.kind, msg.data);
    else if (msg.type === 'done') finishResponse();
    else if (msg.type === 'stopped') { finishResponse(); addMsg('system', 'Stopped'); }
    else if (msg.type === 'error') { addMsg('error', msg.message); showInput(true); }
    else if (msg.type === 'connected') statusEl.textContent = 'Ready';
  };

  ws.onclose = () => {
    statusEl.textContent = 'Disconnected';
    statusEl.className = 'status error';
    setTimeout(connect, 3000);
  };

  ws.onerror = () => { statusEl.textContent = 'Error'; statusEl.className = 'status error'; };
}

function handleEvent(kind, data) {
  if (!currentEl) { currentEl = document.createElement('div'); currentEl.className = 'msg agent'; output.appendChild(currentEl); currentText = ''; }
  if (kind === 'text') append(data.text || '');
  else if (kind === 'assistant' && data.content) {
    const t = Array.isArray(data.content) ? data.content.filter(b => b.type === 'text').map(b => b.text).join('') : (typeof data.content === 'string' ? data.content : '');
    if (t) append(t);
  }
  else if (kind === 'tool_use') append(`\n⚙️ ${data.name || 'tool'}\n`);
  else if (kind === 'thinking' && data.text) append(`\n💭 ${data.text}\n`);
  scroll();
}

function append(text) {
  currentText += text;
  let html = esc(currentText).replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\n/g, '<br>');
  currentEl.innerHTML = html;
}

function finishResponse() { currentEl = null; currentText = ''; showInput(true); }

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function addMsg(role, content) {
  const el = document.createElement('div');
  el.className = `msg ${role}`;
  el.innerHTML = role === 'user' ? `You: ${esc(content)}` : role === 'error' ? `⚠️ ${esc(content)}` : content;
  output.appendChild(el);
  scroll();
}

function send() {
  const text = input.value.trim();
  if (!text || !ws || ws.readyState !== 1) return;
  addMsg('user', text);
  input.value = '';
  showInput(false);
  currentEl = null;
  ws.send(JSON.stringify({ type: 'prompt', text }));
}

function stopAgent() { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'stop' })); }

function showInput(on) {
  input.disabled = !on;
  btnSend.style.display = on ? '' : 'none';
  btnStop.style.display = on ? 'none' : '';
  if (on) input.focus();
}

function scroll() { requestAnimationFrame(() => output.scrollTop = output.scrollHeight); }

input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
connect();
input.focus();
</script>
</body>
</html>
